<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Milton Aguiar" />
    <title>Milton Aguiar — Comic book artist</title>
    <meta name="description" content="Comic book art by Milton Aguiar: pencils, inks and colours. Creator of Raptor, co-founder of ImaginAction Comics. Commissions open." />
    <!-- The site is dark unless this visitor chose the light theme (components/ThemeSwitch.jsx), or the admin holds the
         site to one theme (the build writes which one here, from content/site/visibility.json); applied before the first draw. -->
    <script>try { var only = '__THEME_ONLY__'; if ((only || localStorage.getItem('ma.theme')) === 'light') document.documentElement.dataset.theme = 'light' } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
