# Milton Aguiar — admin panel configuration (Decap CMS)
# Everything on the site that the artist can edit is described here.
# Changes are saved as commits to the repository; the site rebuilds automatically.
#
# Three kinds of section here (public/admin/shell.js, NAV, sorts them into the navigation's
# groups: Orders & customers, Your art, Shop, Members, Page text, Site):
#   1. things that are added to over time: Work, Comic samples, Items for sale, Gallery, Conventions;
#   2. the words on each page: one short form per page ("pages" below);
#   3. single forms for the shop, members and the whole site ("site" below).
# Only labels may change: a collection's or a file's name is where its content is kept.

backend:
  name: git-gateway        # Netlify Identity + Git Gateway. On Vercel the admin page swaps this for a passcode login.
  branch: main
  commit_messages:
    create: 'Content: add {{collection}} "{{slug}}"'
    update: 'Content: update {{collection}} "{{slug}}"'
    delete: 'Content: remove {{collection}} "{{slug}}"'
    uploadMedia: 'Content: upload {{path}}'
    deleteMedia: 'Content: remove {{path}}'

# `npm run dev` starts a local helper on port 8083 so the panel can be used without logging in.
local_backend:
  url: http://localhost:8083/api/v1

publish_mode: simple

media_folder: public/uploads
public_folder: /uploads

site_url: /
display_url: /
# The sidebar already links to the site; Decap's own "View Live" lookups only add error notices.
show_preview_links: false
logo_url: /favicon.png

# One clean form column; the built-in preview only echoes field values.
editor:
  preview: false

collections:
  # ------------------------------------------------------------------ 1. added to over time
  - name: work
    label: Work
    label_singular: Piece
    description: 'Your pieces: covers, pages, pin-ups, sketches. A new one shows on the Work page, the home page and the gallery. To sell one, switch on "Sell it in the Shop" and give it a price.'
    folder: content/work
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} — {{category}}'
    sortable_fields: [date, title, category]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: category, label: Category, widget: relation, collection: site, file: categories, value_field: 'categories.*.name', search_fields: ['categories.*.name'], display_fields: ['categories.*.name'], hint: 'The Work page gets a filter button for every category in use. The list is kept under Shop → Categories & sizes.' }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'D MMM YYYY', time_format: false, picker_utc: true, hint: 'Newest pieces come first.' }
      - { name: link, label: Link to the post, widget: string, required: false, hint: 'The Instagram post, if there is one.' }
      - { name: src, label: Picture, widget: image, choose_url: false, required: false, hint: 'Portrait, about 3:4 (for example 1500×2000px). Other shapes are cropped on the Work page and shown whole in the gallery.' }
      - { name: note, label: A few words about it, widget: text, required: false, hint: 'Shown beside the picture when it is opened.' }
      - { name: featured, label: Show on the home page, widget: boolean, default: false, required: false, hint: 'The first four ticked pieces are the panels beside your name; the next five are the panels of "Latest". With none ticked, the newest are used.' }
      - { name: rough, label: Pencils or work in progress, widget: boolean, default: false, required: false, hint: 'Tick this for sketches and pencilled pages. They stay on the Work page but are left out of the changing pictures beside the page titles, which show finished pieces only.' }
      - { name: homeOrder, label: Place on the home page, widget: number, value_type: int, required: false, hint: 'Only for ticked pieces. 1 is the tall panel beside your name, 2 and 3 the two small ones, 4 the wide one under them; 5 to 9 are the panels of "Latest". Empty: newest first, after the numbered ones.' }
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false, hint: 'Takes it off the site but keeps it here.' }
      - { name: inShop, label: Sell it in the Shop, widget: boolean, default: false, required: false, hint: 'On: it is listed under Shop → Items for sale here too, and once it has a price it is on the Shop page with a Buy button.' }
      - { name: type, label: What it is, widget: relation, collection: site, file: shop, value_field: 'types.*.name', search_fields: ['types.*.name'], display_fields: ['types.*.name'], required: false, hint: 'Prints, Original art, Comics... The list is kept under Shop → Settings & payments. Only needed for a piece you sell.' }
      - name: look
        label: Shown in the shop as
        widget: select
        default: default
        required: false
        options:
          - { label: 'Same as its kind (set under Settings & payments)', value: default }
          - { label: 'Printed poster: the art on white paper', value: poster }
          - { label: 'Framed print: a white mat in a black frame', value: framed }
          - { label: 'Original art board: cream board, blue-line border', value: board }
          - { label: 'Comic book: a cover with its spine and pages', value: comic }
          - { label: 'Just the art, filling the top of the card', value: plain }
        hint: 'How it looks on its card in the Shop: as the thing the buyer gets.'
      - { name: hover, label: Second picture, widget: image, choose_url: false, required: false, hint: 'Optional: the print in a frame, on a wall, a close-up, the back of the book... In the Shop it fades in over the first when someone points at the piece; an opened piece starts on the first picture, with this one a tap away. Same shape as the first works best.' }
      - { name: face, label: As a profile picture, widget: facecrop, required: false, hint: 'A customer who buys this piece can use it as their profile picture (only they can). Drag the picture inside the circle to put the face in place, and zoom in.' }
      - name: status
        label: Tag
        widget: select
        default: none
        required: false
        options:
          - { label: 'None', value: none }
          - { label: 'New (shows a "New" tag)', value: new }
          - { label: 'On sale (shows the old and the new price)', value: sale }
          - { label: 'Sold out (no Buy button)', value: soldout }
        hint: 'Sale and Sold out show while online purchases are switched on; New always shows.'
      - { name: price, label: Price, widget: number, value_type: float, min: 0, required: false, hint: 'In the currency set under Shop → Settings & payments. Not used when it is sold in sizes (below).' }
      - { name: salePrice, label: Sale price, widget: number, value_type: float, min: 0, required: false, hint: 'Only used while the tag is "On sale", and only when it is lower than the price.' }
      - { name: universe, label: Sub category, widget: relation, collection: site, file: categories, value_field: 'subcategories.*.name', search_fields: ['subcategories.*.name'], display_fields: ['subcategories.*.name'], required: false, hint: 'DC, Marvel, Image... Optional. The list is kept under Shop → Categories & sizes; the Shop page can be filtered by it.' }
      - { name: shopOnly, label: Only in the Shop, widget: boolean, default: false, required: false, hint: 'For something you sell that is not a piece of your portfolio (a book, a shirt): it stays off the Work page and the home page.' }
      - name: sizes
        label: Sizes and prices
        label_singular: size
        widget: list
        collapsed: false
        required: false
        summary: '{{fields.size}} — {{fields.price}}'
        hint: 'Sell it in as many sizes as you like: Add size, pick the size from the drop-down, type its price and, for a discount, a lower price. Drag the rows into the order buyers should see. With sizes here, the price above is not used. The sizes in the drop-down are kept under Shop → Categories & sizes.'
        fields:
          - { name: size, label: Size, widget: relation, collection: site, file: categories, value_field: 'sizes.*.name', search_fields: ['sizes.*.name'], display_fields: ['sizes.*.name'], hint: 'Pick it from your list of print sizes (Shop → Categories & sizes).' }
          - { name: price, label: Price, widget: number, value_type: float, min: 0 }
          - { name: salePrice, label: Discount price, widget: number, value_type: float, min: 0, required: false }

  - name: comics
    label: Comic samples
    label_singular: Comic
    description: 'A few pages of a comic for visitors to read: a cover and its pages, in order. Each is a small book on the Work page that opens to read.'
    folder: content/comics
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: text, label: One line about it, widget: string, required: false, hint: 'Shown under the book, for example "Issue #1, the first 8 pages".' }
      - { name: cover, label: Cover, widget: image, choose_url: false, hint: 'The front of the book. Portrait, the same size as the pages reads best.' }
      - name: pages
        label: Pages
        label_singular: page
        widget: list
        collapsed: false
        minimize_collapsed: false
        required: false
        summary: '{{fields.src}}'
        hint: 'Page 1 is the first page after the cover. Upload every page in order (Add page), and drag a page to move it. Portrait pages of the same size read best. A double-page spread is one wide picture: switch on "Two-page spread" and it counts as two pages.'
        fields:
          - { name: src, label: Page, widget: image, choose_url: false }
          - { name: spread, label: Two-page spread (one wide picture), widget: boolean, default: false, required: false }
      - { name: order, label: Order on the page, widget: number, value_type: int, required: false, hint: 'Lower numbers come first. Empty: after the numbered ones, by title.' }
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false, hint: 'Takes it off the site but keeps it here.' }

  - name: shop
    label: Items for sale
    label_singular: Item for sale
    description: 'Everything you sell: prints, original art, comics. A new item can be bought once it has a price. A piece under Your art → Work shows here too once "Sell it in the Shop" is on.'
    folder: content/work
    filter: { field: inShop, value: true }
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} — {{price}}'
    sortable_fields: [date, title, price]
    fields:
      - { name: inShop, widget: hidden, default: true }
      - { name: title, label: Title, widget: string }
      - { name: src, label: Picture, widget: image, choose_url: false, required: false, hint: 'Portrait, about 3:4. Shown whole when the piece is opened.' }
      - { name: hover, label: Second picture, widget: image, choose_url: false, required: false, hint: 'Optional: the print in a frame, on a wall, a close-up, the back of the book... In the Shop it fades in over the first when someone points at the piece; an opened piece starts on the first picture, with this one a tap away. Same shape as the first works best.' }
      - { name: face, label: As a profile picture, widget: facecrop, required: false, hint: 'A customer who buys this piece can use it as their profile picture (only they can). Drag the picture inside the circle to put the face in place, and zoom in.' }
      - { name: price, label: Price, widget: number, value_type: float, min: 0, required: false, hint: 'In the currency set under Shop → Settings & payments. Sold in several sizes? Leave it empty and add the sizes at the bottom.' }
      - { name: salePrice, label: Sale price, widget: number, value_type: float, min: 0, required: false, hint: 'Only used while the tag is "On sale", and only when it is lower than the price.' }
      - { name: type, label: What it is, widget: relation, collection: site, file: shop, value_field: 'types.*.name', search_fields: ['types.*.name'], display_fields: ['types.*.name'], required: false, hint: 'Prints, Original art, Comics... The list is kept under Shop → Settings & payments.' }
      - name: look
        label: Shown in the shop as
        widget: select
        default: default
        required: false
        options:
          - { label: 'Same as its kind (set under Settings & payments)', value: default }
          - { label: 'Printed poster: the art on white paper', value: poster }
          - { label: 'Framed print: a white mat in a black frame', value: framed }
          - { label: 'Original art board: cream board, blue-line border', value: board }
          - { label: 'Comic book: a cover with its spine and pages', value: comic }
          - { label: 'Just the art, filling the top of the card', value: plain }
        hint: 'How it looks on its card in the Shop: as the thing the buyer gets.'
      - name: status
        label: Tag
        widget: select
        default: none
        required: false
        options:
          - { label: 'None', value: none }
          - { label: 'New (shows a "New" tag)', value: new }
          - { label: 'On sale (shows the old and the new price)', value: sale }
          - { label: 'Sold out (no Buy button)', value: soldout }
      - { name: category, label: Category, widget: relation, collection: site, file: categories, value_field: 'categories.*.name', search_fields: ['categories.*.name'], display_fields: ['categories.*.name'], hint: 'The Shop page can be filtered by it. The list is kept under Shop → Categories & sizes.' }
      - { name: universe, label: Sub category, widget: relation, collection: site, file: categories, value_field: 'subcategories.*.name', search_fields: ['subcategories.*.name'], display_fields: ['subcategories.*.name'], required: false, hint: 'DC, Marvel, Image... Optional. The list is kept under Shop → Categories & sizes; the Shop page can be filtered by it.' }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'D MMM YYYY', time_format: false, picker_utc: true, hint: 'Newest come first.' }
      - { name: note, label: A few words about it, widget: text, required: false, hint: 'Shown beside the picture when it is opened.' }
      - { name: shopOnly, label: Only in the Shop, widget: boolean, default: true, required: false, hint: 'On: it stays off the Work page and the home page. Switch it off for a piece that belongs in your portfolio too.' }
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false, hint: 'Takes it off the site but keeps it here.' }
      - name: sizes
        label: Sizes and prices
        label_singular: size
        widget: list
        collapsed: false
        required: false
        summary: '{{fields.size}} — {{fields.price}}'
        hint: 'Sell it in as many sizes as you like: Add size, pick the size from the drop-down, type its price and, for a discount, a lower price. Drag the rows into the order buyers should see. With sizes here, the price above is not used. The sizes in the drop-down are kept under Shop → Categories & sizes.'
        fields:
          - { name: size, label: Size, widget: relation, collection: site, file: categories, value_field: 'sizes.*.name', search_fields: ['sizes.*.name'], display_fields: ['sizes.*.name'], hint: 'Pick it from your list of print sizes (Shop → Categories & sizes).' }
          - { name: price, label: Price, widget: number, value_type: float, min: 0 }
          - { name: salePrice, label: Discount price, widget: number, value_type: float, min: 0, required: false }

  - name: gallery_sections
    label: Gallery
    label_singular: Gallery section
    description: 'The Gallery page, in sections you name (Pencils, Covers, Convention photos...). Each section shows the pieces from Work you pick for it, a whole category, or pictures of its own. It is off to start with: switch it on under Site → Show / hide.'
    folder: content/gallery-sections
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Section name, widget: string }
      - { name: order, label: Order on the page, widget: number, value_type: int, default: 10, hint: 'Lower numbers come first.' }
      - { name: description, label: Short description, widget: string, required: false }
      - name: from
        label: Fill it from Work
        widget: select
        default: none
        options:
          - { label: 'No: only the pieces picked and the pictures added below', value: none }
          - { label: 'Every piece on the Work page', value: all }
          - { label: 'Originals', value: 'Originals' }
          - { label: 'Fan art', value: 'Fan art' }
          - { label: 'Covers', value: 'Covers' }
          - { label: 'Pages', value: 'Pages' }
          - { label: 'Sketches', value: 'Sketches' }
          - { label: 'Collaborations', value: 'Collaborations' }
          - { label: 'Commissions', value: 'Commissions' }
        hint: 'Saves uploading a finished piece twice: the section shows those pieces first, then the ones picked below, then the pictures added below.'
      - { name: pieces, label: 'Pieces from Work (your pick)', widget: relation, collection: work, multiple: true, value_field: '{{slug}}', search_fields: [title], display_fields: [title], required: false, hint: 'Type a title to find a piece; pick as many as you like, in the order they should show. Different sections can show different pieces this way, and a piece shows once even if it is also brought in above.' }
      - name: items
        label: Pictures
        label_singular: picture
        widget: list
        collapsed: false
        required: false
        summary: '{{fields.title}}'
        hint: 'Drag to reorder.'
        fields:
          - { name: src, label: Picture, widget: image, choose_url: false, hint: 'Any shape; it is shown uncropped.' }
          - { name: title, label: Title, widget: string, required: false }
          - { name: note, label: A few words about it, widget: text, required: false }
          - { name: home, label: Show on the home page, widget: boolean, default: false, required: false, hint: 'No longer used: the home page shows pieces from Work.' }
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false, hint: 'Takes the whole section off the site but keeps it here.' }

  - name: events
    label: Conventions
    label_singular: Event
    description: 'Where people can meet you in person: conventions, markets, signings.'
    folder: content/events
    create: true
    extension: json
    format: json
    identifier_field: name
    slug: '{{slug}}'
    summary: '{{name}} — {{when}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Event, widget: string }
      - { name: when, label: When, widget: string, hint: 'Written the way it should read: "14–15 Nov 2026", or "Dates to be announced".' }
      - { name: place, label: City or venue, widget: string, required: false, hint: 'For example "Javits Center, New York".' }
      - { name: role, label: Where to find you there, widget: string, required: false, hint: 'For example "Artist Alley, table 42".' }
      - { name: url, label: Link, widget: string, required: false, hint: 'The event’s site or the tickets page. The whole line becomes a link to it, with an arrow.' }
      - { name: linkLabel, label: Words on the link, widget: string, required: false, hint: 'Shown at the end of the line, for example "Tickets" or "Event page". Without them, only the arrow.' }
      - name: pictures
        label: Pictures
        label_singular: picture
        widget: list
        required: false
        collapsed: false
        max: 3
        field: { name: picture, label: Picture, widget: image, choose_url: false }
        hint: 'Up to three: the poster, your table, a photo from last time. Shown small beside the event on the home page.'
      - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false }
      - { name: order, label: Order on site, widget: number, value_type: int, default: 10, required: false, hint: 'Lower numbers come first.' }

  # ------------------------------------------------------------------ 2. the words on each page
  - name: pages
    label: Page text
    files:
      - name: home
        label: Home page
        file: content/pages/home.json
        fields:
          - { name: kicker, label: Small red tab above the name, widget: string, required: false }
          - { name: text, label: Sentence under the tagline, widget: text, required: false }
          - name: buttons
            label: Buttons under the name
            label_singular: button
            widget: list
            collapsed: true
            required: false
            summary: '{{fields.words}}'
            hint: 'Drag to change their order, Add button for another, the cross to remove one, or Hide to keep one here but off the page. A button to a page that is switched off (or to the Shop while it is off) is left out by itself.'
            fields:
              - { name: words, label: Words on the button, widget: string }
              - name: to
                label: Goes to
                widget: select
                default: shop
                options:
                  - { label: 'Shop', value: shop }
                  - { label: 'Work', value: work }
                  - { label: 'Commissions page', value: commissions }
                  - { label: 'Get a quote (where the quote button goes, under Commissions)', value: quote }
                  - { label: 'About', value: about }
                  - { label: 'Contact', value: contact }
                  - { label: 'Gallery', value: gallery }
                  - { label: 'Another address (below)', value: link }
              - { name: address, label: Address, widget: string, required: false, hint: 'Only for "Another address": the full address, starting https://' }
              - name: tone
                label: Style
                widget: select
                default: red
                options:
                  - { label: 'Red', value: red }
                  - { label: 'Quiet', value: quiet }
              - { name: off, label: Hide, widget: boolean, default: false, required: false }
          - name: figure
            label: Drawing
            widget: object
            collapsed: false
            fields:
              - { name: src, label: Picture, widget: image, choose_url: false, required: false, hint: 'A drawing on a plain white background, or a cut-out with a see-through one (PNG or WebP). It stands beside your name. Remove it to have the name on its own.' }
              - { name: size, label: Size, widget: slider, min: 50, max: 150, step: 1, default: 100, unit: '%', required: false }
              - { name: x, label: Move sideways, widget: slider, min: -100, max: 100, step: 1, default: 0, required: false }
              - { name: y, label: Move up or down, widget: slider, min: -100, max: 100, step: 1, default: 0, required: false }
          - { name: marquee, label: Words, widget: list, hint: 'Separate them with commas.' }
          - name: project
            label: The book or series you are drawing now
            widget: object
            collapsed: false
            required: false
            fields:
              - { name: label, label: Small label, widget: string, required: false }
              - { name: title, label: Title, widget: string, required: false, hint: 'Leave the title empty to take the whole block off the home page.' }
              - { name: subtitle, label: Second line of the title, widget: string, required: false }
              - { name: text, label: Text, widget: text, required: false }
              - { name: image, label: Cover or key art, widget: image, choose_url: false, required: false }
              - { name: buttonLabel, label: Button, widget: string, required: false }
              - { name: url, label: Where the button goes, widget: string, required: false, hint: 'Where people can read or buy it. The cover links there too.' }
              - { name: secondLabel, label: Second button, widget: string, required: false, hint: 'For example the publisher. Leave both of these empty to have one button.' }
              - { name: secondUrl, label: Where the second button goes, widget: string, required: false }
          - { name: latestLabel, label: Small label, widget: string, required: false }
          - { name: latestTitle, label: Heading, widget: string }
          - { name: redrawLabel, label: Small label, widget: string, required: false }
          - { name: redrawTitle, label: Heading, widget: string }
          - { name: redrawText, label: Text, widget: text, required: false }
          - name: steps
            label: The sets
            label_singular: set
            widget: list
            collapsed: false
            required: false
            summary: '{{fields.title}}'
            hint: 'One piece at three stages. Upload the pencils, the inks and the colours of the same drawing, the same shape and framing, so they line up (portrait, about 3:4). Visitors drag two lines across to wipe from one to the next. Without inks, it compares the pencils and the colours.'
            fields:
              - { name: title, label: Title, widget: string, hint: 'For example "Daredevil: Born Again".' }
              - { name: text, label: One line about it, widget: string, required: false }
              - { name: pencils, label: Pencils, widget: image, choose_url: false }
              - { name: inks, label: Inks, widget: image, choose_url: false, required: false }
              - { name: colours, label: Colours, widget: image, choose_url: false }
              - { name: commissions, label: Show on the Commissions page, widget: boolean, default: false, required: false, hint: 'Beside How it works on the Commissions page. One set shows there: the first one switched on (with none switched on, the first set).' }
              - { name: hidden, label: Hide from the site, widget: boolean, default: false, required: false }
          - { name: commissionsTitle, label: Heading, widget: string, hint: 'Set above "Open!" or "Closed", which follows the switch on the Commissions page.' }
          - { name: commissionsButton, label: Button, widget: string }
          - { name: eventsLabel, label: Small label, widget: string, required: false }
          - { name: eventsTitle, label: Heading, widget: string }

      - name: shop
        label: Shop page
        file: content/pages/shop.json
        fields:
          - { name: label, label: Small label, widget: string, required: false, hint: 'Above the heading, for example "The shop".' }
          - { name: title, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text, required: false }
          - { name: steps, label: The steps under the introduction, widget: list, required: false, max: 4, field: { name: step, label: Step, widget: string }, hint: 'Shown as 01, 02, 03: for example "Pick a piece", "Pay by card or PayPal", "Posted to your door". Left empty, the usual three are used, worded for how buyers pay and whether you post.' }
          - { name: listLabel, label: Small label on the list, widget: string, required: false, hint: 'Beside the page number above the pieces, for example "For sale".' }
          - { name: nothingText, label: When a filter finds nothing, widget: string, required: false, hint: 'Before the "Show everything" link.' }
          - { name: emptyTitle, label: Heading while nothing has a price, widget: string, required: false }
          - { name: emptyText, label: Text while nothing has a price, widget: string, required: false }
          - { name: thanksTitle, label: Heading after a purchase, widget: string, required: false }
          - { name: thanksText, label: Text after a purchase, widget: string, required: false }
      - name: lists
        label: Work & Gallery pages
        file: content/pages/lists.json
        fields:
          - { name: workLabel, label: Small label, widget: string, required: false }
          - { name: workTitle, label: Heading, widget: string }
          - { name: workIntro, label: Introduction, widget: text, required: false }
          - { name: samplesLabel, label: Small label, widget: string, required: false, hint: 'Above the comic samples on the Work page (they are added under Comic samples, and show once there is one).' }
          - { name: samplesTitle, label: Heading, widget: string, required: false }
          - { name: samplesIntro, label: Introduction, widget: text, required: false }
          - { name: galleryLabel, label: Small label, widget: string, required: false }
          - { name: galleryTitle, label: Heading, widget: string }
          - { name: galleryIntro, label: Introduction, widget: text, required: false }
          - name: galleryView
            label: How the Gallery page is laid out to start with
            widget: select
            default: wall
            required: false
            options:
              - { label: 'Wall: columns, nothing cropped', value: wall }
              - { label: 'Grid: even tiles', value: grid }
              - { label: 'Strip: one row you scroll sideways', value: strip }
              - { label: 'Spotlight: one big picture with the rest beside it', value: spotlight }
            hint: 'Visitors can switch between these four; this is the one they see first.'

      - name: commissions
        label: Commissions page
        file: content/pages/commissions.json
        fields:
          - { name: open, label: Commissions are open, widget: boolean, default: true, hint: 'Switches the "Commissions open" light in the top bar and on the page. Off: no request form, and the site refuses new requests (commissions already asked for carry on in the customers'' accounts).' }
          - { name: title, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - { name: processLabel, label: Small label, widget: string, required: false }
          - { name: processTitle, label: Heading, widget: string }
          - name: steps
            label: Steps
            label_singular: Step
            widget: list
            summary: '{{fields.title}}'
            hint: 'Shown as numbered panels beside the pencils-to-colours set (pick which set under Page text → Home → Pencils to colours: "Show on the Commissions page"). A step that mentions pencils, inks or colours shows that stage when picked; the last step shows the finished piece.'
            fields:
              - { name: title, label: Step, widget: string }
              - { name: text, label: Description, widget: text }
          - name: tiers
            label: Offers
            label_singular: Offer
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: text, label: Description, widget: text }
              - { name: price, label: Price, widget: string, required: false, hint: 'Written the way it should read: "From €60". Empty shows the quote button on its own. Either way the offer links to where quotes are given.' }
              - { name: includes, label: What is included, widget: list, required: false, hint: 'Separate them with commas.' }
          - { name: quoteLabel, label: Wording of the quote button, widget: string, required: false, hint: 'On every offer and price tag. Empty reads "Get a quote".' }
          - name: quoteVia
            label: Where the quote button goes
            widget: select
            required: false
            default: site
            hint: 'On the site: the visitor sends their idea from the request card and you talk it through in Orders → Commissions.'
            options:
              - { label: 'On the site (default)', value: site }
              - { label: 'Instagram', value: instagram }
              - { label: 'By email', value: email }
              - { label: 'Another link', value: link }
          - { name: quoteUrl, label: The other link, widget: string, required: false, hint: 'Only for "Another link": the full address, starting https://' }
          - { name: requestLabel, label: Small label, widget: string, required: false }
          - { name: requestTitle, label: Heading while open, widget: string }
          - { name: closedTitle, label: Heading while closed, widget: string }
          - { name: closedText, label: Text while closed, widget: text, required: false, hint: 'Shown instead of the request form while commissions are closed.' }
          - name: notes
            label: Points
            label_singular: Point
            widget: list
            required: false
            field: { name: text, label: Point, widget: string }

      - name: about
        label: About page
        file: content/pages/about.json
        fields:
          - { name: title, label: Heading, widget: string }
          - { name: intro, label: Sentence under the heading, widget: text, required: false }
          - { name: image, label: Picture beside the heading, widget: image, choose_url: false, required: false }
          - name: story
            label: Your story, a panel at a time
            label_singular: Panel
            widget: list
            summary: '{{fields.title}}'
            hint: 'Each panel is a picture with words beside it. They swap sides as the page goes down. Drag to reorder.'
            fields:
              - { name: title, label: Heading, widget: string, required: false }
              - { name: text, label: Words, widget: text }
              - { name: image, label: Picture, widget: image, choose_url: false, required: false, hint: 'Without one the words take the full width.' }
              - { name: button, label: Button, widget: string, required: false, hint: 'Optional: a button under the words. It needs the address below.' }
              - { name: url, label: Where the button goes, widget: string, required: false }
          - name: facts
            label: Facts
            label_singular: Fact
            widget: list
            required: false
            summary: '{{fields.label}}: {{fields.value}}'
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }

      - name: contact
        label: Contact page
        file: content/pages/contact.json
        fields:
          - { name: label, label: Small label, widget: string, required: false }
          - { name: title, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - { name: topics, label: Choices in the "About" drop-down, widget: list, required: false, hint: 'What a visitor can say their message is about. Separate them with commas. With none, the drop-down is left out.' }

  # ------------------------------------------------------------------ 3. the whole site
  - name: site
    label: Site
    files:
      - name: brand
        label: Brand & contact
        file: content/site/brand.json
        fields:
          - { name: name, label: Site name, widget: string, hint: 'The second word takes the brand colour.' }
          - { name: artist, label: Your name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: blurb, label: One or two sentences about the site, widget: text, hint: 'Shown in the footer, and by search engines and link previews.' }
          - { name: hue, label: Brand colour, widget: slider, min: 0, max: 360, step: 1, default: 25, unit: '°', hint: 'The one colour on the site. 25 is the red of the logo. 55 orange, 145 green, 200 teal, 250 blue, 340 pink.' }
          - { name: logo, label: Logo, widget: image, choose_url: false, required: false, hint: 'Optional. A small square picture shown beside the name in the top bar.' }
          - { name: email, label: Contact email, widget: string, required: false, hint: 'Where the commission and contact forms send to. With no email (and no form service below) the forms are replaced by a button to your Instagram.' }
          - { name: location, label: Location, widget: string, required: false }
          - { name: contactAction, label: Form service address, widget: string, required: false, hint: 'Optional. With an address from a form service (Formspree and the like) the forms send there. Empty, they open the visitor''s mail app.' }
          - name: social
            label: Links
            label_singular: Link
            widget: list
            required: false
            summary: '{{fields.label}} {{fields.handle}}'
            fields:
              - { name: label, label: Network, widget: string, hint: 'Instagram, Threads, TikTok, X, Facebook, YouTube, Discord and ArtStation get their own icon. The Instagram link is also the "More on Instagram" button on the Gallery page.' }
              - { name: handle, label: Handle, widget: string, required: false }
              - { name: url, label: Address, widget: string }
          - { name: footerLine, label: Closing line in the red panel of the last page, widget: string, required: false }
          - { name: footerFine, label: Small print after the © line, widget: string, required: false }

      - name: shop
        label: Shop settings & payments
        file: content/site/shop.json
        fields:
          - { name: enabled, label: Online purchases, widget: boolean, default: false, hint: 'On: the Shop page and the cart button are on the site, and every piece with a price shows it with its buttons to buy. Off: no shop, no prices and no buttons anywhere.' }
          - name: payments
            label: How buyers pay
            widget: select
            default: stripe
            options:
              - { label: 'Stripe (card, Apple Pay, Google Pay)', value: stripe }
              - { label: 'PayPal', value: paypal }
              - { label: 'Both: buyers choose at checkout', value: both }
            hint: 'Stripe needs STRIPE_SECRET_KEY in the Vercel settings; PayPal needs PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET (and PAYPAL_ENV = live for real money; without it PayPal runs in its sandbox, for testing). Discount codes are kept in Stripe, so they need the Stripe key either way.'
          - { name: currency, label: Currency, widget: select, default: eur, options: [{ label: 'Euro (EUR)', value: eur }, { label: 'US dollar (USD)', value: usd }, { label: 'British pound (GBP)', value: gbp }, { label: 'Brazilian real (BRL)', value: brl }, { label: 'Canadian dollar (CAD)', value: cad }, { label: 'Australian dollar (AUD)', value: aud }] }
          - { name: buttonLabel, label: Wording of the Buy button, widget: string, hint: 'Shown as "… now" beside "Add to cart".' }
          - name: pricePlace
            label: Price on the Work page cards
            widget: select
            default: corner
            required: false
            options:
              - { label: 'Top corner of the picture', value: corner }
              - { label: 'In the caption, under the title', value: below }
          - name: tagPlace
            label: Tags on the cards
            widget: select
            default: corner
            required: false
            hint: 'The New, Sale and Sold out tags, on the Shop and Work page cards. (On the Shop page the price always sits beside the title.)'
            options:
              - { label: 'Top corner of the picture', value: corner }
              - { label: 'In the caption, under the title', value: below }
          - name: cartIcon
            label: Cart button icon
            widget: select
            default: bag
            required: false
            options:
              - { label: 'Shopping bag', value: bag }
              - { label: 'Shopping cart', value: cart }
            hint: 'The icon on the cart button in the top bar and on the Add to cart buttons in the Shop.'
          - name: look
            label: How pieces are shown in the shop
            widget: select
            default: poster
            required: false
            options:
              - { label: 'Printed poster: the art on white paper', value: poster }
              - { label: 'Framed print: a white mat in a black frame', value: framed }
              - { label: 'Original art board: cream board, blue-line border', value: board }
              - { label: 'Comic book: a cover with its spine and pages', value: comic }
              - { label: 'Just the art, filling the top of the card', value: plain }
            hint: 'Each piece is shown on its card as the thing the buyer gets. This is the look for any kind below set to "Shop default", and any piece set to "Same as its kind".'
          - { name: note, label: What the buyer gets, widget: string, required: false, hint: 'One line under every price and on the payment page, for example "A4 print on heavy paper." A line written beside a kind below is used instead for pieces of that kind.' }
          - name: types
            label: Kinds of thing you sell
            label_singular: kind
            widget: list
            collapsed: false
            required: false
            summary: '{{fields.name}}'
            hint: 'Prints, Original art, Comics... Each piece you sell is one of these ("What it is", on the piece). Beside each, what the buyer gets (empty: the line above) and how pieces of that kind are shown in the shop. Drag to reorder.'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: note, label: What the buyer gets, widget: string, required: false }
              - name: look
                label: Shown as
                widget: select
                default: default
                required: false
                options:
                  - { label: 'Shop default', value: default }
                  - { label: 'Printed poster', value: poster }
                  - { label: 'Framed print', value: framed }
                  - { label: 'Original art board', value: board }
                  - { label: 'Comic book', value: comic }
                  - { label: 'Just the art', value: plain }
          - { name: signedChoice, label: Buyers can add a signature, widget: boolean, default: false, required: false, hint: 'On: every piece has a "Signed by …" switch beside its price, off to start with; the order says signed or unsigned. Off: no switch.' }
          - { name: signedExtra, label: Extra for a signed piece, widget: number, value_type: float, min: 0, default: 0, required: false, hint: 'Added to the price when the buyer switches the signature on. 0 for no extra cost.' }
          - { name: shipping, label: Ask for a delivery address, widget: boolean, default: true, required: false, hint: 'On for anything you post. Off for downloads.' }
          - { name: countries, label: Countries you post to, widget: list, required: false, hint: 'Two-letter country codes, separated by commas: PT, ES, FR, GB, US.' }
          - name: emails
            label: Emails to you
            widget: object
            required: false
            collapsed: false
            hint: 'Which emails come to you (at the contact email under Site → Brand & contact). Emails to your customers always go.'
            fields:
              - { name: orders, label: New shop orders, widget: boolean, default: true, required: false, hint: 'An email for each order paid in the Shop.' }
              - { name: commissions, label: New commission requests and payments, widget: boolean, default: true, required: false, hint: 'An email when someone asks for a commission, and when they pay its quote.' }
              - { name: replies, label: Customer replies on commissions, widget: boolean, default: true, required: false, hint: 'An email when a customer writes in a commission conversation, or cancels one. Off: you see them in Orders → Commissions.' }

      - name: categories
        label: Categories & sizes
        file: content/site/categories.json
        fields:
          - name: categories
            label: Categories
            label_singular: category
            widget: list
            collapsed: false
            summary: '{{fields.name}}'
            hint: 'Originals, Fan art, Covers... Used by every piece, in Work and in the Shop. Add, rename, delete, or drag to reorder: the drop-down on the Shop page follows this order. Hide: it is left out of the drop-down, the Work page buttons and the cards, but its pieces stay on the site. Renaming one does not rename it on the pieces that use it.'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: hidden, label: Hide, widget: boolean, default: false, required: false }
          - name: subcategories
            label: Sub categories
            label_singular: sub category
            widget: list
            collapsed: false
            required: false
            summary: '{{fields.name}}'
            hint: 'DC, Marvel, Image... A second way to filter the Shop. Optional on each piece. Hide: it is left out of the drop-down and the cards, but its pieces stay in the Shop.'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: hidden, label: Hide, widget: boolean, default: false, required: false }
          - name: sizes
            label: Print sizes
            label_singular: size
            widget: list
            collapsed: false
            required: false
            summary: '{{fields.name}}'
            hint: 'A4, A3, 50 × 70 cm canvas... The sizes in the drop-down on each item for sale; the item sets its own price for each. Beside each, its measurements, shown to buyers when they pick a size. Renaming one does not rename it on items that already use it.'
            fields:
              - { name: name, label: Name, widget: string }
              - { name: note, label: Measurements, widget: string, required: false }

      - name: account
        label: Member settings
        file: content/pages/account.json
        fields:
          - name: accounts
            label: Member accounts
            widget: select
            default: 'off'
            options:
              - { label: 'Off: everyone buys as a guest', value: 'off' }
              - { label: 'Optional: buyers can make an account, or buy as a guest', value: optional }
              - { label: 'Required: an account is needed to buy', value: required }
            hint: 'An account keeps the cart on every device, saves pieces for later, shows the buyer their orders with where each is up to, and gives them a membership card with their member number. Needs the database: MONGODB_URI in the Vercel project settings, and for the password and confirmation emails SMTP_HOST, SMTP_USER and SMTP_PASS (or RESEND_API_KEY and MAIL_FROM). Until the database is set up, accounts stay hidden and everyone buys as a guest.'
          - { name: cardLabel, label: Word on the membership card, widget: string, required: false, hint: 'The tag in the corner of the card: Collector, Member, Fan club...' }
          - { name: noteTitle, label: Heading of your note, widget: string, required: false, hint: 'Shown to every customer on their account page, signed by you.' }
          - { name: note, label: Your note to customers, widget: text, required: false, hint: 'A few warm lines. Empty: no note.' }
          - { name: signature, label: Signed, widget: string, required: false }
          - { name: collectionTitle, label: Heading over the pieces they own, widget: string, required: false }
          - { name: savedTitle, label: Heading over the pieces they saved, widget: string, required: false }
          - name: icons
            label: Free profile pictures
            label_singular: picture
            widget: list
            collapsed: false
            required: false
            summary: '{{fields.name}}'
            hint: 'Pictures any customer can choose for their profile. Drag a picture inside its circle to place it, and zoom with the slider under it. Pieces a customer buys also become pictures that only they can use.'
            fields:
              - { name: picture, label: Picture, widget: image, choose_url: false }
              - { name: face, label: Crop, widget: facecrop, required: false }
              - { name: name, label: Name, widget: string, required: false }

      - name: rewards
        label: Rewards
        file: content/pages/rewards.json
        fields:
          - { name: rewardText, label: What confirming the email unlocks, widget: string, required: false, hint: 'Shown to customers who have not confirmed their email yet, in the reminder on their account page.' }
          - name: pictures
            label: Profile pictures
            label_singular: profile picture
            widget: list
            collapsed: true
            minimize_collapsed: true
            required: false
            summary: '{{fields.name}}'
            hint: 'Pictures customers earn for their profile. The circle shows it as customers will see it: drag the picture in it, and zoom.'
            fields:
              - { name: name, label: Name, widget: string, hint: 'Shown to customers. Keep it once customers have it: the name is how the site knows the reward.' }
              - { name: picture, label: The picture, widget: image, choose_url: false }
              - { name: face, label: As customers see it, widget: facecrop, required: false }
              - name: earnedBy
                label: How it is earned
                widget: select
                default: verify
                options:
                  - { label: 'Confirming their email', value: verify }
                  - { label: 'A number of orders', value: orders }
                  - { label: 'A number of pieces collected', value: pieces }
                  - { label: 'A number of commissions', value: commissions }
              - { name: count, label: How many, widget: number, value_type: int, min: 1, default: 3, required: false, hint: 'The orders, pieces or commissions it takes: 1 for their first, 3, 6, 10... A commission counts once it is paid. Refunded, cancelled and deleted ones do not count, and commissions never count as shop orders or pieces.' }
              - { name: hidden, label: Hide (not offered for now), widget: boolean, default: false, required: false }
          - name: cards
            label: Membership card designs
            label_singular: card design
            widget: list
            collapsed: true
            minimize_collapsed: true
            required: false
            summary: '{{fields.name}}'
            hint: 'Looks for the membership card that customers earn. The card under each one shows it as customers will see it: drag its picture to put it in place.'
            fields:
              - { name: name, label: Name, widget: string, hint: 'Shown to customers. Keep it once customers have it.' }
              - name: cardLook
                label: The look
                widget: select
                default: ink
                options:
                  - { label: 'Ink: black, with the brand colour', value: ink }
                  - { label: 'Gold foil', value: gold }
                  - { label: 'Chrome', value: chrome }
                  - { label: 'A picture of your choosing', value: art }
              - { name: cardArt, label: Picture across the card, widget: image, choose_url: false, required: false, hint: 'Needed for "A picture of your choosing", optional with the others. A picture with a quiet bottom half works best: the name sits there.' }
              - { name: cardCrop, label: Picture on the card, widget: cardcrop, required: false, hint: 'The card as customers see it. Drag the picture on it to put it in place, and zoom in with the slider.' }
              - { name: cardBack, label: Picture on the back (optional), widget: image, choose_url: false, required: false, hint: 'The card turns over on the site. Without a picture here, the back carries the same picture and look as the front.' }
              - { name: cardBackCrop, label: The back, widget: cardcrop, side: back, required: false, hint: 'The back as customers see it: the stripe, their signature and the small print sit over the picture.' }
              - name: earnedBy
                label: How it is earned
                widget: select
                default: verify
                options:
                  - { label: 'Confirming their email', value: verify }
                  - { label: 'A number of orders', value: orders }
                  - { label: 'A number of pieces collected', value: pieces }
                  - { label: 'A number of commissions', value: commissions }
              - { name: count, label: How many, widget: number, value_type: int, min: 1, default: 3, required: false, hint: 'The orders, pieces or commissions it takes: 1 for their first, 3, 6, 10... A commission counts once it is paid. Refunded, cancelled and deleted ones do not count, and commissions never count as shop orders or pieces.' }
              - { name: hidden, label: Hide (not offered for now), widget: boolean, default: false, required: false }
          - name: discounts
            label: Discounts
            label_singular: discount
            widget: list
            collapsed: true
            minimize_collapsed: true
            required: false
            summary: '{{fields.name}}'
            hint: 'A personal code for one order, made the moment a customer earns it, that only their email can use. Codes are made in Stripe and show under Shop → Discount codes too.'
            fields:
              - { name: name, label: Name, widget: string, hint: 'Shown to customers, e.g. "3 orders: 10% off".' }
              - { name: percent, label: Discount (%), widget: number, value_type: float, min: 1, max: 100, default: 10 }
              - { name: days, label: Days to use it, widget: number, value_type: int, min: 1, default: 60, hint: 'How long their code works after they earn it.' }
              - name: earnedBy
                label: How it is earned
                widget: select
                default: verify
                options:
                  - { label: 'Confirming their email', value: verify }
                  - { label: 'A number of orders', value: orders }
                  - { label: 'A number of pieces collected', value: pieces }
                  - { label: 'A number of commissions', value: commissions }
              - { name: count, label: How many, widget: number, value_type: int, min: 1, default: 3, required: false, hint: 'The orders, pieces or commissions it takes: 1 for their first, 3, 6, 10... A commission counts once it is paid. Refunded, cancelled and deleted ones do not count, and commissions never count as shop orders or pieces.' }
              - { name: hidden, label: Hide (not offered for now), widget: boolean, default: false, required: false }
          - name: points
            label: Points
            widget: object
            collapsed: false
            hint: 'Every paid order and commission earns points for what was paid; confirming the email and saying yes to news earn a one-off bonus; points are spent on the ladder below. The account page shows the balance, how far to the next reward, and the ladder.'
            fields:
              - { name: on, label: Points are running, widget: boolean, default: true, required: false, hint: 'Off: points leave the site entirely (the account page, the card, the sign-up), and nothing is earned or spent. The balances are kept. Switched on again, every account is caught up on what it would have earned meanwhile: its orders, commissions and bonuses.' }
              - { name: perUnit, label: Points for each euro paid, widget: number, value_type: float, min: 0, default: 1, required: false, hint: '1: a €40 order earns 40 points. Whole points, on what was actually paid, once per order; taken back if the payment is refunded.' }
              - { name: signup, label: Points for confirming the email, widget: number, value_type: int, min: 0, default: 50, required: false, hint: 'Once, when the address is confirmed.' }
              - { name: field, label: Points for each detail filled in, widget: number, value_type: int, min: 0, default: 10, required: false, hint: 'The name, the phone number, the email and the password (which counts as two: typed and confirmed), once each, the moment they are there.' }
              - { name: news, label: Points for saying yes to news, widget: number, value_type: int, min: 0, default: 25, required: false, hint: 'Once ever: taken back if they unsubscribe, and not given a second time.' }
              - { name: name, label: What they are called, widget: string, default: points, required: false, hint: 'For example "points" or "stars".' }
              - { name: intro, label: A line about them, widget: string, required: false, hint: 'Shown over the ladder in the account, for example "Every order earns points. Spend them on prints and discounts."' }
              - name: rewards
                label: The ladder (what points buy)
                label_singular: reward
                widget: list
                collapsed: false
                required: false
                summary: '{{fields.name}} — {{fields.cost}}'
                hint: 'A discount makes a code of their own (like the earned discounts, through Stripe). A gift is something you arrange and send (a free print, a sketch): they claim it, you are emailed, and you mark it as sent in their window under Customers.'
                fields:
                  - { name: name, label: Name, widget: string, hint: 'Shown to customers, for example "A free A4 print". Keep it once claimed: the name is how the site knows it.' }
                  - { name: cost, label: Points it takes, widget: number, value_type: int, min: 1, default: 500 }
                  - name: kind
                    label: What it is
                    widget: select
                    default: gift
                    options:
                      - { label: 'A gift you send (a print, a sketch...)', value: gift }
                      - { label: 'A discount code', value: discount }
                  - { name: percent, label: Percent off (discounts), widget: number, value_type: int, min: 1, max: 100, default: 10, required: false }
                  - { name: days, label: Days the code lasts (discounts), widget: number, value_type: int, min: 1, default: 60, required: false }
                  - { name: text, label: A few words about it, widget: string, required: false, hint: 'For example "Any print up to A4, posted to you."' }
                  - { name: hidden, label: Hide (not offered for now), widget: boolean, default: false, required: false }
      - name: sales
        label: Price cuts
        file: content/site/sales.json
        fields:
          - name: sales
            label: Price cuts
            label_singular: price cut
            widget: list
            collapsed: true
            minimize_collapsed: true
            required: false
            summary: '{{fields.name}} — {{fields.percent}}% off'
            hint: 'Price cuts switch themselves on and off: no code needed. One runs while it is On, between its start and its end. A piece in more than one gets the biggest cut, never two; a piece with its own sale price gets whichever is cheaper. Discount codes still come off on top at the checkout. Sold-out pieces are left alone.'
            fields:
              - { name: name, label: Name, widget: string, hint: 'Shown to visitors on the Shop page and beside the price: Black Friday, Summer sale...' }
              - { name: percent, label: Price cut (%), widget: number, value_type: int, min: 1, max: 90, default: 10, hint: 'Usual cuts: 5, 10, 15, 20, 25, 30 or 50. Up to 90.' }
              - name: appliesTo
                label: On what
                widget: select
                default: all
                options:
                  - { label: 'Everything in the shop', value: all }
                  - { label: 'A category', value: category }
                  - { label: 'A sub category', value: subcategory }
                  - { label: 'A type', value: type }
              - { name: category, label: Which category, widget: relation, collection: site, file: categories, value_field: 'categories.*.name', search_fields: ['categories.*.name'], display_fields: ['categories.*.name'], required: false, hint: 'From your list under Shop → Categories & sizes.' }
              - { name: subcategory, label: Which sub category, widget: relation, collection: site, file: categories, value_field: 'subcategories.*.name', search_fields: ['subcategories.*.name'], display_fields: ['subcategories.*.name'], required: false, hint: 'From your list under Shop → Categories & sizes.' }
              - { name: type, label: Which type, widget: relation, collection: site, file: shop, value_field: 'types.*.name', search_fields: ['types.*.name'], display_fields: ['types.*.name'], required: false, hint: 'From your list under Shop → Settings & payments.' }
              - { name: starts, label: Starts, widget: datetime, required: false, hint: 'Empty: straight away.' }
              - { name: ends, label: Ends, widget: datetime, required: false, hint: 'Empty: until you switch it off.' }
              - { name: 'on', label: 'On', widget: boolean, default: true, required: false }
              - { name: banner, label: Line on the Shop page, widget: string, required: false, hint: 'Shown after the name, in a red band above the pieces while it runs. Empty: made for you, e.g. "10% off everything until 31 Oct" or "15% off Fan art".' }
      - name: visibility
        label: Show / hide
        file: content/site/visibility.json
        fields:
          - name: pages
            label: Pages
            widget: object
            collapsed: false
            hint: 'A page that is switched off also leaves the menu. The Shop also needs online purchases switched on, under Shop → Settings & payments.'
            fields:
              - { name: work, label: Work, widget: boolean, default: true }
              - { name: shop, label: Shop, widget: boolean, default: true }
              - { name: gallery, label: Gallery, widget: boolean, default: false }
              - { name: commissions, label: Commissions, widget: boolean, default: true }
              - { name: about, label: About, widget: boolean, default: true }
              - { name: contact, label: Contact, widget: boolean, default: true }
          - name: home
            label: Parts of the home page
            widget: object
            collapsed: false
            fields:
              - { name: ticker, label: Moving band of words, widget: boolean, default: true }
              - { name: project, label: Current project, widget: boolean, default: true }
              - { name: latest, label: Latest pieces, widget: boolean, default: true }
              - { name: redraws, label: Pencils to colours, widget: boolean, default: true }
              - { name: commissions, label: Commissions, widget: boolean, default: true }
              - { name: events, label: Conventions, widget: boolean, default: true }
          - name: commissions
            label: Parts of the Commissions page
            widget: object
            collapsed: false
            hint: 'The page itself is switched on or off under Pages. Whether new requests are being taken (open, or closed with a note) is under Page text → Commissions.'
            fields:
              - { name: offers, label: What I draw (the offers), widget: boolean, default: true, required: false }
              - { name: process, label: How it works, widget: boolean, default: true, required: false }
              - { name: request, label: The request card, widget: boolean, default: true, required: false, hint: 'Off: nobody can ask on the site. The card leaves the page and the account, and quote buttons go to your email instead (left out without one). Commissions already asked for carry on.' }
          - name: themes
            label: Dark and light
            widget: object
            collapsed: false
            hint: 'Visitors switch between the two with the sun and moon button in the top bar; the site opens dark. Switch one off and the site is always the other, and the button goes. (With both off, both stay on.)'
            fields:
              - { name: dark, label: Dark mode, widget: boolean, default: true, required: false }
              - { name: light, label: Light mode, widget: boolean, default: true, required: false }
          - name: art
            label: Artwork
            widget: object
            collapsed: false
            hint: 'The Milton Aguiar logo inside the pictures of the Work, Shop and Gallery pages and the pencils-to-colours sets: clear in a corner, faint and large in the middle, so nobody can pass the art off as theirs. It is put on when the site is rebuilt, a minute or two after you save. Pictures stay web-sized either way. Your uploads are never changed.'
            fields:
              - { name: watermark, label: Logo on the artwork (watermark), widget: boolean, default: true, required: false }
              - { name: comicsWatermark, label: Logo on the comic samples too, widget: boolean, default: true, required: false, hint: 'Off: the comic books (Your art → Comic samples) are shown without the logo, while the rest of the artwork keeps it.' }
          - name: shop
            label: Parts of the Shop page
            widget: object
            collapsed: false
            hint: 'The drop-downs above the pieces. Each also needs two or more choices in use before it shows.'
            fields:
              - { name: category, label: Category drop-down, widget: boolean, default: true, required: false }
              - { name: subcategory, label: Sub category drop-down, widget: boolean, default: true, required: false }
              - { name: type, label: Type drop-down, widget: boolean, default: true, required: false }
          - name: sales
            label: Test data
            widget: object
            collapsed: false
            hint: 'For Orders, Customers and Discount codes. Test data is what Stripe and PayPal make in their test modes (and the samples shown on your own computer). Each switch hides it from its own screen, or shows it again: nothing is ever deleted, and real orders, customers and codes always show.'
            fields:
              - { name: testOrders, label: Test orders, widget: boolean, default: true, required: false }
              - { name: testCustomers, label: Test customers, widget: boolean, default: true, required: false }
              - { name: testCodes, label: Test discount codes, widget: boolean, default: true, required: false }
